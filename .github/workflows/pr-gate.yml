name: PR Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Quality and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint without warnings
        run: npm run lint -- --max-warnings=0

      - name: Unit and integration tests
        run: npm test

      - name: Executor contract tests
        run: npm run test:executor

      - name: Release tooling tests
        run: npm run test:scripts

      - name: Validate Compose contracts
        run: npm run validate:compose

      - name: Scan secrets
        run: npm run scan:secrets

      - name: Scan repository deployment policy
        run: npm run scan:repository-policy

      - name: Build production artifacts
        run: npm run build

  postgres-concurrency:
    name: PostgreSQL concurrency evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pigo_ci
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: pigo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pigo_ci -d pigo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build server artifacts
        run: npm run build

      - name: Exercise real PostgreSQL contention paths
        env:
          PI_DATABASE_URL: postgresql://pigo_ci:ci-local-only@127.0.0.1:5432/pigo_ci
        run: npm run test:pg:concurrency
