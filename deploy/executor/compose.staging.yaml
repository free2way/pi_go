name: pigo-release-executor-staging

services:
  executor:
    image: ${PIGO_STAGING_EXECUTOR_IMAGE:?Set the immutable staging Executor image}
    container_name: pigo-release-executor-staging
    restart: unless-stopped
    init: true
    depends_on:
      release-gateway:
        condition: service_healthy
    ports:
      - target: 3300
        published: "${PIGO_STAGING_EXECUTOR_HOST_PORT:-3301}"
        host_ip: 127.0.0.1
    networks:
      - pigo-network
      - release-control
    environment:
      HOST: 0.0.0.0
      PORT: 3300
      PIGO_EXECUTOR_TOKEN: ${PIGO_STAGING_EXECUTOR_TOKEN:?Set the staging Executor token}
      PIGO_EXECUTOR_ALLOWED_ENVIRONMENTS: staging
      PIGO_EXECUTOR_WORKSPACE_ROOT: /workspace
      PIGO_EXECUTOR_APP_PATH: ${PIGO_EXECUTOR_APP_PATH:-apps/order-status-app}
      PIGO_EXECUTOR_DATA_FILE: /data/executions.json
      PIGO_EXECUTOR_CALLBACK_ORIGIN: ${PIGO_STAGING_CALLBACK_ORIGIN:?Set the staging callback origin}
      PIGO_EXECUTOR_CALLBACK_INTERNAL_ORIGIN: ${PIGO_STAGING_CALLBACK_INTERNAL_ORIGIN:?Set the staging callback internal origin}
      PIGO_EXECUTOR_IMAGE_REPOSITORY: ${PIGO_EXECUTOR_IMAGE_REPOSITORY:-local/order-status-app}
      PIGO_EXECUTOR_TARGET_NETWORK: ${PIGO_EXECUTOR_TARGET_NETWORK:-pigo-release-targets}
      PIGO_RELEASE_GATEWAY_URL: http://pigo-release-gateway-staging:3310
      PIGO_RELEASE_GATEWAY_TOKEN: ${PIGO_RELEASE_GATEWAY_TOKEN:?Set the Release Gateway token}
      PIGO_EXECUTOR_STAGING_URL: ${PIGO_EXECUTOR_STAGING_URL:-http://host.docker.internal:18080}
      PIGO_EXECUTOR_STAGING_PUBLIC_URL: ${PIGO_EXECUTOR_STAGING_PUBLIC_URL:-}
      PIGO_EXECUTOR_STAGING_PORT: ${PIGO_EXECUTOR_STAGING_PORT:-18080}
    volumes:
      - ${PIGO_HOST_WORKSPACE_ROOT:?Set the exact host workspace root}:/workspace:ro
      - executor-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  release-gateway:
    image: ${PIGO_STAGING_EXECUTOR_IMAGE:?Set the immutable staging Executor image}
    container_name: pigo-release-gateway-staging
    restart: unless-stopped
    init: true
    command: ["node", "/app/release-gateway.mjs"]
    networks:
      - release-control
    environment:
      HOST: 0.0.0.0
      PORT: 3310
      PIGO_RELEASE_GATEWAY_TOKEN: ${PIGO_RELEASE_GATEWAY_TOKEN:?Set the Release Gateway token}
      PIGO_EXECUTOR_WORKSPACE_ROOT: /workspace
      PIGO_EXECUTOR_APP_PATH: ${PIGO_EXECUTOR_APP_PATH:-apps/order-status-app}
      PIGO_EXECUTOR_IMAGE_REPOSITORY: ${PIGO_EXECUTOR_IMAGE_REPOSITORY:-local/order-status-app}
      PIGO_EXECUTOR_TARGET_NETWORK: ${PIGO_EXECUTOR_TARGET_NETWORK:-pigo-release-targets}
      PIGO_EXECUTOR_STAGING_PORT: ${PIGO_EXECUTOR_STAGING_PORT:-18080}
      PIGO_RELEASE_REQUIRE_ROOTLESS: ${PIGO_RELEASE_REQUIRE_ROOTLESS:-1}
    volumes:
      - ${PIGO_HOST_WORKSPACE_ROOT:?Set the exact host workspace root}:/workspace:ro
      - ${PIGO_RELEASE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the Docker socket group id}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3310/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  executor-data:
    name: pigo-release-executor-staging-data

networks:
  pigo-network:
    name: ${PIGO_DOCKER_NETWORK:-pi-agent-network}
    external: true
  release-control:
    name: pigo-release-control
    external: true
