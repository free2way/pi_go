name: pi-agent

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pigo
      POSTGRES_PASSWORD: ${PIGO_POSTGRES_PASSWORD:?Set PIGO_POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_DB: pigo
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>/docker;
      # mounting the old .../data path makes the entrypoint exit with an error.
      - pigo-postgres-data:/var/lib/postgresql
    networks:
      - pi-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigo -d pigo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  runtime:
    build:
      context: .
      args:
        PI_VERSION: "1.0.0"
    image: local/pi-coding-agent:1.0.0
    restart: unless-stopped
    init: true
    working_dir: /workspace
    environment:
      PI_DEVELOPER_MODEL: ${PI_DEVELOPER_MODEL:-deepseek-flash}
      PI_REVIEWER_PROVIDER: ${PI_REVIEWER_PROVIDER:-openai-proxy}
      PI_REVIEWER_MODEL: ${PI_REVIEWER_MODEL:-gpt-5.6-sol}
      OPENAI_BASE_URL: ${PI_REVIEWER_BASE_URL:-}
    volumes:
      - ./workspace:/workspace
      - pi-config:/home/node/.pi
    networks:
      - pi-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "pi", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ${WEB_BUILD_CONTEXT:-../..}
      dockerfile: deploy/docker/Dockerfile.web
    image: local/pigo-web:0.1.0
    restart: unless-stopped
    init: true
    environment:
      HOST: web
      PORT: 3100
      PI_DATA_FILE: /app/data/runs.json
      PI_VAULT_FILE: /app/data/credentials.v1.json
      PI_VAULT_SECRET: ${PI_VAULT_SECRET:?Set PI_VAULT_SECRET in the deployment environment}
      PI_DATABASE_URL: postgresql://pigo:${PIGO_POSTGRES_PASSWORD:?Set PIGO_POSTGRES_PASSWORD in the deployment environment}@postgres:5432/pigo
      PI_AUTH_MODE: ${PI_AUTH_MODE:?Set PI_AUTH_MODE in the deployment environment}
      PI_CF_ACCESS_TEAM_DOMAIN: ${PI_CF_ACCESS_TEAM_DOMAIN:-}
      PI_CF_ACCESS_AUDIENCE: ${PI_CF_ACCESS_AUDIENCE:-}
      PI_PUBLIC_ORIGIN: ${PI_PUBLIC_ORIGIN:-}
      PI_DEMO_MODE: "true"
      PI_VERSION: "1.0.0"
      PI_DEVELOPER_MODEL: ${PI_DEVELOPER_MODEL:-deepseek-flash}
      PI_REVIEWER_PROVIDER: ${PI_REVIEWER_PROVIDER:-openai-proxy}
      PI_REVIEWER_MODEL: ${PI_REVIEWER_MODEL:-gpt-5.6-sol}
      PI_REAL_RUNS_ENABLED: ${PI_REAL_RUNS_ENABLED:-false}
      PI_WORKER_URL: http://worker:3200
      PI_INTERNAL_TOKEN: ${PI_INTERNAL_TOKEN:-}
      # AUD-08 (v0.22): explicit model allowlist. Empty string = the builtin
      # catalog merged with the role defaults; a JSON array is strict/verbatim.
      PI_MODEL_CATALOG_JSON: ${PI_MODEL_CATALOG_JSON:-}
      # AUD-08: `probe` (default) or `off` (operator asserts stored keys).
      PI_MODEL_PROBE_MODE: ${PI_MODEL_PROBE_MODE:-probe}
      PI_PROVIDER_PROBE_BASE_URL: ${PI_PROVIDER_PROBE_BASE_URL:-}
      PI_STARTUP_CREDENTIAL_PROBE_BUDGET_MS: ${PI_STARTUP_CREDENTIAL_PROBE_BUDGET_MS:-10000}
      # A1 (docs/10): opt-in merge-request creation; PI_MERGE_REQUEST_URL enables it.
      PI_MERGE_REQUEST_URL: ${PI_MERGE_REQUEST_URL:-}
      PI_MERGE_REQUEST_TOKEN: ${PI_MERGE_REQUEST_TOKEN:-}
      PI_MERGE_REQUEST_PROJECT: ${PI_MERGE_REQUEST_PROJECT:-}
      PI_MERGE_REQUEST_TARGET_BRANCH: ${PI_MERGE_REQUEST_TARGET_BRANCH:-}
      # Explicit release hook. Webhooks require the token for Bearer + HMAC.
      PI_POST_MERGE_DEPLOY_HOOK: ${PI_POST_MERGE_DEPLOY_HOOK:-}
      PI_POST_MERGE_DEPLOY_TOKEN: ${PI_POST_MERGE_DEPLOY_TOKEN:-}
      # A3: read-only deployment panel sources.
      PI_WEB_VERSION: ${PI_WEB_VERSION:-}
      PI_WORKER_VERSION: ${PI_WORKER_VERSION:-}
      PI_ROLLBACK_TAGS: ${PI_ROLLBACK_TAGS:-}
      PI_DEPLOY_LOG: ${PI_DEPLOY_LOG:-/app/pi-agent/backups/deploy.log}
      # COST-002: run-level budgets; 0 = unlimited (see docs/03, docs/04).
      PI_RUN_MAX_TOKENS: ${PI_RUN_MAX_TOKENS:-0}
      PI_RUN_MAX_COST_USD: ${PI_RUN_MAX_COST_USD:-0}
      PI_RUN_MAX_MODEL_CALLS: ${PI_RUN_MAX_MODEL_CALLS:-0}
      PI_RUN_MAX_DURATION_SECONDS: ${PI_RUN_MAX_DURATION_SECONDS:-0}
      # SEC-008: per-user write rate limits.
      PI_RUN_CREATE_PER_MINUTE: ${PI_RUN_CREATE_PER_MINUTE:-20}
      PI_RUN_ACTIONS_PER_MINUTE: ${PI_RUN_ACTIONS_PER_MINUTE:-30}
      # REL-005: alert webhook and cooldown.
      PI_ALERT_WEBHOOK: ${PI_ALERT_WEBHOOK:-}
      PI_ALERT_COOLDOWN_SECONDS: ${PI_ALERT_COOLDOWN_SECONDS:-900}
      PI_ARTIFACT_MAX_DOWNLOAD_BYTES: ${PI_ARTIFACT_MAX_DOWNLOAD_BYTES:-5242880}
      PI_JOB_STALE_SECONDS: ${PI_JOB_STALE_SECONDS:-120}
      PI_PIPELINE_VERSION: ${PI_PIPELINE_VERSION:-pigo-pipeline-1}
      PI_WORKSPACES_ENABLED: ${PI_WORKSPACES_ENABLED:-true}
    ports:
      - target: 3100
        published: "3100"
        host_ip: ${PI_WEB_BIND_ADDRESS:?Set PI_WEB_BIND_ADDRESS in the deployment environment}
    volumes:
      - pigo-web-data:/app/data
      # A3: deployment log for the read-only panel, mounted read-only. Host dir
      # defaults to <project-dir>/backups (the compose file is copied to
      # /app/pi-agent on the host). When the directory/file is absent the mount
      # is empty and `/api/deployments` reports log.available=false.
      - ${PI_DEPLOY_LOG_HOST_DIR:-./backups}:/app/pi-agent/backups:ro
    networks:
      - pi-network
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://web:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ${WEB_BUILD_CONTEXT:-../..}
      dockerfile: deploy/docker/Dockerfile.worker
    image: local/pigo-worker:0.1.0
    restart: unless-stopped
    init: true
    working_dir: /workspace
    environment:
      HOST: worker
      PORT: 3200
      PI_DEVELOPER_PROVIDER: ${PI_DEVELOPER_PROVIDER:-deepseek}
      PI_DEVELOPER_MODEL: ${PI_DEVELOPER_MODEL:-deepseek-flash}
      PI_REVIEWER_PROVIDER: ${PI_REVIEWER_PROVIDER:-openai-proxy}
      PI_REVIEWER_MODEL: ${PI_REVIEWER_MODEL:-gpt-5.6-sol}
      OPENAI_BASE_URL: ${PI_REVIEWER_BASE_URL:-}
      PI_WORKSPACE_ROOT: /workspace
      PI_WEB_CALLBACK_URL: http://web:3100
      PI_INTERNAL_TOKEN: ${PI_INTERNAL_TOKEN:-}
      PI_MAX_REVIEW_ROUNDS: ${PI_MAX_REVIEW_ROUNDS:-3}
      PI_MAX_SUBAGENTS: ${PI_MAX_SUBAGENTS:-3}
      PI_MAX_ACTIVE_JOBS: ${PI_MAX_ACTIVE_JOBS:-1}
      PI_RUN_TIMEOUT_SECONDS: ${PI_RUN_TIMEOUT_SECONDS:-1800}
      # SEC-004/AT-SEC-007:每个 Agent 调用与检查命令都在独立容器中执行。
      PI_SANDBOX_MODE: ${PI_SANDBOX_MODE:-auto}
      PI_SANDBOX_IMAGE: ${PI_SANDBOX_IMAGE:-local/pigo-sandbox:0.1.0}
      PI_SANDBOX_NETWORK: ${PI_SANDBOX_NETWORK:-pi-agent-network}
      PI_HOST_WORKSPACE_ROOT: ${PI_HOST_WORKSPACE_ROOT:-/app/pi-agent/workspace}
      PI_SANDBOX_MODELS_FILE: ${PI_SANDBOX_MODELS_FILE:-/app/pi-agent/pi-models.json}
      # v0.22: worker identity, reported by /health and the deployment panel.
      PI_WORKER_ID: ${PI_WORKER_ID:-}
      PI_WORKER_VERSION: ${PI_WORKER_VERSION:-}
      # GAP-02 (v0.22): plugins are default-off; only allowlisted resources load.
      PI_PLUGIN_ALLOWLIST: ${PI_PLUGIN_ALLOWLIST:-}
      PI_PLUGIN_REQUESTS: ${PI_PLUGIN_REQUESTS:-}
      PI_PLUGIN_REQUIRE_PIN: ${PI_PLUGIN_REQUIRE_PIN:-false}
      PI_PLUGIN_ALLOW_PROJECT: ${PI_PLUGIN_ALLOW_PROJECT:-false}
      PI_PLUGIN_CONTAINER_DIR: ${PI_PLUGIN_CONTAINER_DIR:-/opt/pigo/plugins}
      # Sprint 2: SHA-256 pinned plugin registry (container path). Empty (default)
      # keeps the flat-allowlist behaviour. When set, the file is read from the
      # read-only mount below; a missing/invalid file fails startup loudly instead
      # of silently disabling plugins.
      PI_PLUGIN_REGISTRY: ${PI_PLUGIN_REGISTRY:-}
      # COST-002: run-level budgets; 0 = unlimited. Max duration falls back to
      # PI_RUN_TIMEOUT_SECONDS when unset (empty string here preserves that).
      PI_RUN_MAX_TOKENS: ${PI_RUN_MAX_TOKENS:-0}
      PI_RUN_MAX_COST_USD: ${PI_RUN_MAX_COST_USD:-0}
      PI_RUN_MAX_MODEL_CALLS: ${PI_RUN_MAX_MODEL_CALLS:-0}
      PI_RUN_MAX_DURATION_SECONDS: ${PI_RUN_MAX_DURATION_SECONDS:-}
      # REL-010: workspace disk watermarks.
      PI_MIN_FREE_DISK_MB: ${PI_MIN_FREE_DISK_MB:-2048}
      PI_CRITICAL_FREE_DISK_MB: ${PI_CRITICAL_FREE_DISK_MB:-}
      # REL-005: bounded provider retry/backoff.
      PI_PROVIDER_ATTEMPTS: ${PI_PROVIDER_ATTEMPTS:-3}
      PI_PROVIDER_BACKOFF_MS: ${PI_PROVIDER_BACKOFF_MS:-2000}
      PI_PROVIDER_MAX_BACKOFF_MS: ${PI_PROVIDER_MAX_BACKOFF_MS:-30000}
      # COST-006: planner reasoning effort.
      PI_PLANNER_THINKING: ${PI_PLANNER_THINKING:-low}
      # Reviewer performance: medium by default; late stream failures are not
      # replayed from zero after the configured elapsed threshold.
      PI_REVIEWER_THINKING: ${PI_REVIEWER_THINKING:-medium}
      PI_REVIEW_RETRY_MAX_ELAPSED_SECONDS: ${PI_REVIEW_RETRY_MAX_ELAPSED_SECONDS:-120}
      # Review convergence and deterministic diff-input budgets.
      PI_REVIEW_CONVERGENCE_GUARD: ${PI_REVIEW_CONVERGENCE_GUARD:-on}
      PI_REVIEW_STALL_ROUNDS: ${PI_REVIEW_STALL_ROUNDS:-2}
      PI_REVIEW_FILE_DIFF_BYTES: ${PI_REVIEW_FILE_DIFF_BYTES:-40000}
      PI_REVIEW_TOTAL_DIFF_BYTES: ${PI_REVIEW_TOTAL_DIFF_BYTES:-200000}
      # Sprint 2 A/B: `off` makes developer/integrator/sub-agent sessions fresh
      # each repair round instead of reusing one `--session-id` (default on).
      PI_SESSION_REUSE: ${PI_SESSION_REUSE:-on}
      PI_CALLBACK_MAX_BYTES: ${PI_CALLBACK_MAX_BYTES:-}
      PI_WORKSPACE_LOCK_STALE_SECONDS: ${PI_WORKSPACE_LOCK_STALE_SECONDS:-300}
      # Sandbox / docker plumbing (defaults match the code).
      PI_DOCKER_SOCKET: ${PI_DOCKER_SOCKET:-/var/run/docker.sock}
      PI_DOCKER_API_VERSION: ${PI_DOCKER_API_VERSION:-v1.43}
      PI_GIT_EMPTY_CONFIG: ${PI_GIT_EMPTY_CONFIG:-/dev/null}
      PI_SANDBOX_EXTRA_BINDS: ${PI_SANDBOX_EXTRA_BINDS:-}
      PI_SANDBOX_EXTRA_ENV: ${PI_SANDBOX_EXTRA_ENV:-}
    volumes:
      - ./workspace:/workspace
      # The worker creates the per-task sandbox containers through the Docker
      # socket. It is a privileged mount: see docs/03 安全组说明 for the tradeoff
      # (replace with a socket proxy if the host is shared with untrusted users).
      - /var/run/docker.sock:/var/run/docker.sock
      # SEC-004: agent processes must not see the interactive Pi configuration
      # volume (auth.json, session transcripts, caches). Only the secret-free
      # provider/model definition is mounted, read-only; keys arrive per job via
      # the vault and are injected into the child environment for the current
      # role only. Regenerate the file with `deploy/docker/export-models.sh`.
      - ./pi-models.json:/home/node/.pi/agent/models.json:ro
      # Sprint 2: read-only SHA-256 plugin registry (see PI_PLUGIN_REGISTRY).
      # Defaults to the shipped example (all-zero placeholder digests) so the
      # mount always resolves to a real file; point
      # PI_PLUGIN_REGISTRY_HOST_FILE at a registry with real digests before
      # enabling PI_PLUGIN_REGISTRY.
      - ${PI_PLUGIN_REGISTRY_HOST_FILE:-./pi-plugins.example.json}:/app/pi-agent/pi-plugins.json:ro
      - pigo-worker-state:/home/node/.pi
    # The socket is owned by root:docker (typically 0660); the non-root worker
    # user joins that group so it can create sandbox containers without running
    # as root itself. Find the value with: stat -c %g /var/run/docker.sock
    group_add:
      - "${PI_DOCKER_GID:-983}"
    networks:
      - pi-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://worker:3200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  pi-network:
    name: pi-agent-network

volumes:
  pi-config:
    name: pi-agent-config
  pigo-worker-state:
    name: pigo-worker-state
  pigo-web-data:
    name: pigo-web-data
  pigo-postgres-data:
    name: pigo-postgres-data
